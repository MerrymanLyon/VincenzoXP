<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Good, the Bad &amp; the Zero-Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&display=swap">
<style>
/* Full-window game. The page itself never scrolls or zooms: every touch belongs to the game. */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; position: fixed; inset: 0; }
body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
canvas:focus { outline: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="The Good, the Bad and the Zero-Day"></canvas>
<script>
(() => {
  // =====================================================================
  // helpers
  // =====================================================================
  const K = "#140c08";
  const px = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  const makeCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const lerpBand = (bands, t, x, y) => { const f = clamp(t, 0, 1) * (bands.length - 1), i = Math.min(bands.length - 2, Math.floor(f)); return f - i > BAYER[y & 3][x & 3] / 16 ? bands[i + 1] : bands[i]; };
  const touch = window.matchMedia("(pointer: coarse)").matches || (navigator.maxTouchPoints > 0 && !window.matchMedia("(any-pointer: fine)").matches);
  let kbd = !touch; // a keyboard is attached (or a key was just pressed)

  // ---------- 3x5 pixel font ----------
  const G = {
    A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",
    G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
    M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101111011",R:"110101110101101",
    S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
    Y:"101101010010010",Z:"111001010100111","0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110",
    "4":"101101111001001","5":"111100110001110","6":"011100110101010","7":"111001010010010","8":"010101010101010","9":"010101011001110",
    "!":"010010010000010","+":"000010111010000","-":"000000111000000",":":"000010000010000","/":"001001010100100",".":"000000000000010"," ":"000000000000000",
    "<":"001010100010001",">":"100010001010100","=":"000111000111000","'":"010010000000000",",":"000000000010100","?":"110001010000010",
    "#":"101111101111101","@":"111101111100111","$":"011110010011110","%":"101001010100101","*":"101010111010101","↑":"010111010010010","↓":"010010010111010","&":"010101010101011",
  };
  const textW = (s, k = 1) => s.length * 4 * k - k;
  const text = (ctx, s, x, y, k, col, outlined = true) => {
    const draw = (ox, oy, c) => [...s].forEach((ch, i) => { const g = G[ch] || G[ch.toUpperCase()] || G[" "]; for (let j = 0; j < 15; j++) if (g[j] === "1") px(ctx, ox + (i * 4 + (j % 3)) * k, oy + Math.floor(j / 3) * k, c, k, k); });
    if (outlined) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) draw(x + dx * k, y + dy * k, K);
    draw(x, y, col);
  };

  // =====================================================================
  // the stage: skies per level, mountains, forest, cemetery, stone ring
  // =====================================================================
  const SKIES = [
    { sky: ["#f4e2b8", "#efd4a0", "#e7c088", "#dcaa72"], sun: "#fff6dc", far: "#b8957c", near: "#987462", forest: "#3e4836", ground: ["#d0a466", "#c09256", "#ab7d46", "#8e6436"] },
    { sky: ["#e9d6b0", "#e2c294", "#d9aa7a", "#cc9468"], sun: "#fff0cc", far: "#a98a7c", near: "#8a6a5e", forest: "#3a4234", ground: ["#c69a5e", "#b4884e", "#9e7440", "#825a32"] },
    { sky: ["#f0c47a", "#e8a85e", "#de8c4a", "#cc6e3c"], sun: "#ffe2a0", far: "#9a6e5e", near: "#7a5048", forest: "#33362a", ground: ["#c4874c", "#b0743e", "#975e34", "#7a482a"] },
    { sky: ["#5a3a5e", "#a0485a", "#d8644a", "#f09a52"], sun: "#ffd07a", far: "#6a3e4e", near: "#4e2c3e", forest: "#22202a", ground: ["#9a5a42", "#844a38", "#6c3a30", "#542c28"] },
    { sky: ["#0e1428", "#18203c", "#24304e", "#344262"], sun: "#e8eef8", far: "#2c3650", near: "#1e2640", forest: "#121624", ground: ["#4a4a5a", "#3c3c4c", "#30303e", "#242430"] },
  ];
  const paintStage = (ctx, S, w, h, hz, ring = true) => {
    const img = ctx.createImageData(w, h), d = img.data, hex = {};
    const put = (x, y, c) => { const v = hex[c] || (hex[c] = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]), o = (y * w + x) * 4; d[o] = v[0]; d[o + 1] = v[1]; d[o + 2] = v[2]; d[o + 3] = 255; };
    for (let y = 0; y < hz; y++) for (let x = 0; x < w; x++) put(x, y, lerpBand(S.sky, y / hz, x, y));
    const sx = Math.round(w * 0.74), sy = Math.round(hz * 0.32);
    for (let y = -16; y <= 16; y++) for (let x = -16; x <= 16; x++) {
      const dd = Math.hypot(x, y), X = sx + x, Y = sy + y;
      if (X >= 0 && X < w && Y >= 0 && Y < hz && (dd < 8 || (dd < 14 && (dd - 8) / 6 < BAYER[(y + 32) & 3][(x + 32) & 3] / 16))) put(X, Y, S.sun);
    }
    for (let x = 0; x < w; x++) {
      const far = hz - 13 - Math.round(9 * Math.sin(x / 23) + 5 * Math.sin(x / 9 + 2) + 3 * Math.sin(x / 4.3));
      const near = hz - 5 - Math.round(4 * Math.sin(x / 17 + 1) + 2 * Math.sin(x / 6.1));
      for (let y = Math.max(0, far); y < hz; y++) put(x, y, y >= near ? S.near : S.far);
    }
    for (let x = 0; x < w; x += 3) {
      const th = 4 + Math.floor(hash(x, 7) * 6);
      for (let k = 0; k < th; k++) for (let i = 0; i < 1 + 2 * Math.floor(k / 3); i++) { const X = x + 1 - Math.floor(k / 3) + i; if (X >= 0 && X < w) put(X, hz - th + k, S.forest); }
    }
    for (let y = hz; y < Math.min(h, hz + 3); y++) for (let x = 0; x < w; x++) put(x, y, S.forest);
    for (let y = hz + 3; y < h; y++) for (let x = 0; x < w; x++) {
      let c = lerpBand(S.ground, 1 - (y - hz) / (h - hz), x, y);
      if (hash(x, y) < 0.025) c = S.ground[3];
      if (hash(y, x) < 0.012) c = S.ground[0];
      put(x, y, c);
    }
    ctx.putImageData(img, 0, 0);
    for (let n = 0; n < Math.round(w * 0.4); n++) {
      const x = Math.floor(hash(n, 1) * w), y = hz + 4 + Math.floor(hash(n, 2) ** 1.8 * 12);
      const s = 1 + (y - hz) / 10;
      if (hash(n, 3) < 0.6) {
        const hh = Math.round(4 * s), aw = Math.round(1.5 * s);
        px(ctx, x, y - hh, "#5a3e2a", 1, hh); px(ctx, x - aw, y - hh + Math.round(hh / 3), "#5a3e2a", aw * 2 + 1, 1); px(ctx, x, y - hh, "#8a6444");
      } else {
        const sw = Math.max(2, Math.round(2 * s)), sh = Math.max(2, Math.round(2.4 * s));
        px(ctx, x, y - sh, "#8c8478", sw, sh); px(ctx, x, y - sh, "#b0a898", sw, 1); px(ctx, x + sw - 1, y - sh + 1, "#6a6258", 1, sh - 1);
      }
    }
    if (!ring) return;
    const rcx = w * 0.62, rcy = hz + (h - hz) * 0.75, rx = w * 0.78, ry = (h - hz) * 0.62;
    for (let y = hz + 6; y < h; y++) for (let x = 0; x < w; x++) {
      const r = ((x - rcx) / rx) ** 2 + ((y - rcy) / ry) ** 2;
      if (r < 0.9) { if (hash(x, y) < 0.3) px(ctx, x, y, S.ground[0]); }
      else if (r < 1.08) { const stone = hash(Math.floor(x / 5), Math.floor(y / 3)); px(ctx, x, y, (y % 3 === 0 || x % 5 === 0) ? "#6a6258" : stone < 0.5 ? "#b4a898" : "#988c7e"); }
    }
  };

  // =====================================================================
  // rivals: front view, light from the right like the sun
  // =====================================================================
  const outline = (c) => {
    const x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height).data, w = c.width, h = c.height, out = [];
    const on = (i, j) => i >= 0 && j >= 0 && i < w && j < h && d[(j * w + i) * 4 + 3] > 0;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (!on(i, j) && (on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) out.push([i, j]);
    out.forEach(([i, j]) => px(x, i, j, K));
    return c;
  };
  const SKIN = { warm: ["#7a4a30", "#a8704c", "#d09a6e"], pale: ["#8c8478", "#b4ac9c", "#d8d0c0"], tan: ["#6a4028", "#946040", "#ba8458"] };
  const makeGunslinger = (S) => {
    const c = makeCanvas(26, 46), x = c.getContext("2d");
    const R = (x0, y0, w, h, col) => px(x, x0 + 1, y0 + 1, col, w, h);
    const sh = (x0, y0, w, h, r) => { R(x0, y0, w, h, r[1]); R(x0, y0, 1, h, r[0]); R(x0 + w - 1, y0, 1, h, r[2]); };
    const skin = SKIN[S.skin];
    sh(7, 40, 4, 4, S.boots); sh(13, 40, 4, 4, S.boots); R(7, 43, 4, 1, K); R(13, 43, 4, 1, K);
    if (S.dress) { for (let y = 16; y < 41; y++) { const w = 12 + Math.floor((y - 16) / 3) * 2; sh(12 - w / 2, y, w, 1, S.coat); } }
    else {
      sh(8, 31, 3, 9, S.pants); sh(13, 31, 3, 9, S.pants); sh(6, 16, 12, 12, S.shirt);
      if (S.duster) { sh(5, 17, 3, 20, S.coat); sh(16, 17, 3, 20, S.coat); sh(6, 16, 12, 2, S.coat); }
      if (S.vest) { sh(6, 17, 4, 10, S.vest); sh(14, 17, 4, 10, S.vest); }
    }
    R(6, 27, 12, 1, "#3a2418"); R(11, 27, 2, 1, "#e8c060");
    sh(17, 28, 2, 5, ["#3a2418", "#5a3820", "#7a5030"]); R(17, 26, 2, 2, "#e8dcc0");
    if (S.twin) { sh(5, 28, 2, 5, ["#3a2418", "#5a3820", "#7a5030"]); R(5, 26, 2, 2, "#e8dcc0"); }
    const arm = S.duster || S.dress ? S.coat : S.shirt;
    sh(4, 17, 2, 11, arm); sh(18, 17, 2, 9, arm);
    R(4, 28, 2, 2, skin[1]); R(18, 26, 2, 2, skin[2]);
    R(11, 15, 2, 1, skin[0]); sh(9, 9, 6, 6, skin); R(9, 9, 6, 1, skin[0]);
    R(10, 12, 1, 1, K); R(13, 12, 1, 1, K);
    const Hh = S.hatCol;
    if (S.hat === "wide") { R(4, 8, 16, 2, Hh[1]); R(12, 8, 8, 1, Hh[2]); R(8, 3, 8, 5, Hh[1]); R(15, 3, 1, 5, Hh[2]); R(11, 3, 2, 1, Hh[0]); R(8, 7, 8, 1, Hh[0]); }
    if (S.hat === "top") { R(6, 8, 12, 1, Hh[1]); R(8, 0, 8, 8, Hh[1]); R(15, 0, 1, 8, Hh[2]); R(8, 6, 8, 1, "#5a1a1a"); }
    if (S.hat === "flat") { R(3, 8, 18, 1, Hh[1]); R(12, 8, 9, 1, Hh[2]); R(5, 9, 14, 1, Hh[0]); R(8, 5, 8, 3, Hh[1]); R(15, 5, 1, 3, Hh[2]); }
    if (S.hat === "kepi") { R(9, 3, 6, 1, Hh[1]); R(8, 4, 8, 5, Hh[1]); R(15, 4, 1, 5, Hh[2]); R(8, 7, 8, 1, "#c8a040"); R(8, 9, 9, 1, K); }
    if (S.bandana) { R(9, 15, 6, 2, "#b02a2a"); R(11, 17, 2, 1, "#b02a2a"); R(14, 15, 1, 1, "#e05a4a"); }
    if (S.veil) for (let j = 10; j < 16; j++) for (let i = 9; i < 15; i++) if ((i + j) % 2 === 0) R(i, j, 1, 1, "#241a20");
    if (S.flower) { R(15, 6, 2, 2, "#d03030"); R(16, 6, 1, 1, "#ff7a6a"); }
    if (S.collar) R(10, 16, 4, 1, "#f0ece0");
    if (S.epaulettes) { R(4, 16, 4, 2, "#e8c060"); R(16, 16, 4, 2, "#e8c060"); R(4, 18, 4, 1, "#a88030"); R(16, 18, 4, 1, "#a88030"); }
    if (S.mustache) { R(10, 13, 4, 1, "#2a1a10"); R(9, 14, 1, 1, "#2a1a10"); R(14, 14, 1, 1, "#2a1a10"); }
    if (S.sash) for (let k = 0; k < 11; k++) R(7 + k, 17 + k, 2, 1, "#a82828");
    if (S.bandolier) for (let k = 0; k < 10; k++) { R(16 - k, 17 + k, 2, 1, "#5a3820"); if (k % 2 === 0) R(16 - k, 17 + k, 1, 1, "#e8c060"); }
    if (S.scar) R(13, 11, 1, 3, skin[0]);
    if (S.tape) R(4, 21, 1, 6, "#e8d080");
    return outline(c);
  };
  // reaction = how long after the red crow each rival needs to shoot, in milliseconds
  const CHARACTERS = [
    { name: "THE KID", ms: 900, hat: "wide", hatCol: ["#8a6a40", "#b08a56", "#d0aa70"], skin: "warm", shirt: ["#5a7a9a", "#7a9aba", "#9abad6"], vest: ["#4a3020", "#6a4630", "#8a5e40"], pants: ["#3a4a6a", "#4e6086", "#6a7ca0"], boots: ["#3a2418", "#5a3820", "#7a5030"], bandana: true, young: true },
    { name: "LA VIUDA", ms: 760, hat: "flat", hatCol: ["#140c10", "#2a1c22", "#46323a"], skin: "pale", coat: ["#140c10", "#2a1c22", "#46323a"], boots: ["#140c10", "#2a1c22", "#46323a"], dress: true, veil: true, flower: true, twin: true },
    { name: "THE UNDERTAKER", ms: 620, hat: "top", hatCol: ["#101010", "#242428", "#3e3e46"], skin: "pale", shirt: ["#a8a49c", "#d0ccc4", "#f0ece4"], coat: ["#101012", "#22222a", "#3a3a44"], pants: ["#1a1a20", "#2a2a32", "#40404a"], boots: ["#101010", "#222226", "#3a3a40"], duster: true, collar: true, tape: true },
    { name: "THE PREACHER", ms: 480, hat: "flat", hatCol: ["#2a2018", "#46382a", "#6a5640"], skin: "tan", shirt: ["#2a2420", "#3e3630", "#5a5046"], coat: ["#241c16", "#3a2e22", "#544432"], pants: ["#2a2420", "#3e3630", "#5a5046"], boots: ["#241810", "#3e2a1c", "#5a3e2a"], duster: true, collar: true, bandolier: true, scar: true },
    { name: "THE COLONEL", ms: 340, hat: "kepi", hatCol: ["#1e2a40", "#2e3e5e", "#46587c"], skin: "warm", shirt: ["#1e2a40", "#2e3e5e", "#46587c"], coat: ["#1a2438", "#2a3852", "#405274"], pants: ["#3a3a46", "#50505e", "#6a6a7a"], boots: ["#101010", "#242428", "#3e3e46"], duster: true, epaulettes: true, sash: true, mustache: true },
  ];
  CHARACTERS.forEach((c) => { c.sprite = makeGunslinger(c); });

  // Leone-style extreme close-up on the eyes, one strip per rival
  const makeEyes = (C) => {
    const c = makeCanvas(64, 16), x = c.getContext("2d"), skin = SKIN[C.skin];
    for (let j = 0; j < 16; j++) for (let i = 0; i < 64; i++) px(x, i, j, lerpBand([skin[2], skin[1], skin[0]], Math.abs(i - 32) / 40 + (j < 6 ? 0.25 : 0), i, j));
    for (let j = 0; j < 4; j++) for (let i = 0; i < 64; i++) if (j < 2 || (j - 2) / 2 < BAYER[j & 3][i & 3] / 16) px(x, i, j, C.hatCol[0]);
    for (const ex of [18, 46]) {
      const dir = ex < 32 ? 1 : -1;
      for (let k = -6; k <= 6; k++) px(x, ex + k, 6 + Math.round(Math.abs(k) * 0.15) + (k * dir > 2 ? 1 : 0), "#2a1a10"); // brow, angled to the nose
      for (let k = -5; k <= 5; k++) { const hh = Math.abs(k) < 3 ? 2 : 1; px(x, ex + k, 9, "#efe6d6", 1, hh); }
      px(x, ex - 1, 9, "#3a2414", 3, 2); px(x, ex, 9, "#120a06"); px(x, ex + 1, 9, "#fff8ec");
      px(x, ex - 5, 8, K, 11, 1); px(x, ex - 4, 11, skin[0], 9, 1);
      if (!C.young) { px(x, ex + 7 * dir, 9, skin[0], 2, 1); px(x, ex + 7 * dir, 11, skin[0], 2, 1); }
    }
    if (C.scar) for (let j = 5; j < 14; j++) px(x, 44 + (j % 2), j, "#5a2e20");
    if (C.veil) for (let j = 0; j < 16; j++) for (let i = 0; i < 64; i++) if ((i + j) % 2 === 0) px(x, i, j, "rgba(24,14,20,0.7)");
    return c;
  };
  CHARACTERS.forEach((c) => { c.eyes = makeEyes(c); });

  // =====================================================================
  // you: modelled as shapes with depth, lit, then quantised into pixels
  // materials: 0 duster, 1 hat, 2 hat band, 3 hair, 4 skin, 5 leather, 6 walnut, 7 metal, 8 glove, 9 cape, 10 scarf
  // =====================================================================
  const RAMPS = [
    ["#100c0a", "#1a1512", "#262019", "#342b22", "#463a2e", "#5c4c3c"],
    ["#2c1a10", "#4a2c18", "#6c4224", "#8e5a32", "#b47a44", "#d49a5c"],
    ["#0e0806", "#1c120c", "#2c1c12", "#3e2a1a"],
    ["#0c0806", "#181009", "#24180e", "#342214", "#4a3220"],
    ["#3c2218", "#5a3424", "#7a4a32", "#9c6444", "#c08458", "#e0a878"],
    ["#1c100a", "#2e1a0e", "#462814", "#62381c", "#7e4c28"],
    ["#2a160c", "#4a2a16", "#6e4224", "#9a6234", "#c48a50"],
    ["#5a5248", "#8c8476", "#c8c0b0", "#f4eee2"],
    ["#1a100a", "#2c1a10", "#40281a", "#583a24", "#744c30"],
    ["#2a160e", "#45261a", "#633a24", "#83522f", "#a86d3c", "#c98c50"],
    ["#3a0c10", "#5e1418", "#86201f", "#ae3628", "#d0543a"],
  ];
  const RIM = { 0: "#e8b880", 1: "#ffd49a", 3: "#d8a070", 8: "#d8a070", 9: "#ffd49a", 10: "#ff8a5a" };
  const renderPlayer = (breath, flutter) => {
    const PW = 132, PH = 150, c = makeCanvas(PW, PH), ctx = c.getContext("2d");
    const mat = new Int8Array(PW * PH).fill(-1), val = new Float32Array(PW * PH);
    const set = (i, j, m, v) => { i = Math.round(i); j = Math.round(j); if (i < 0 || j < 0 || i >= PW || j >= PH) return; mat[j * PW + i] = m; val[j * PW + i] = v; };
    const cx = 60, b = breath;
    // long dark duster with folds and a vent up the back
    for (let j = 74 + b; j < PH; j++) {
      const hw = 40 + (j - 74) * 0.22;
      for (let i = 0; i < PW; i++) {
        const dx = (i - cx) / hw; if (Math.abs(dx) > 1) continue;
        let v = 0.4 + 0.4 * dx + 0.12 * Math.sin(i / 4.2 + j / 55) + (j > 100 ? 0.08 * Math.sin(i / 2.2 + 1) : 0) - 0.16 * (j - 74) / 80;
        if (j > 118 && Math.abs(i - (cx - 2)) < 1) v -= 0.3;
        set(i, j, 0, v);
      }
    }
    // layered leather cape: an upper collar layer and a lower layer with a fringed hem
    const capeLayer = (top, hemBase, widthMax, grow, base) => {
      for (let j = top + b; j < hemBase + 6; j++) for (let i = 0; i < PW; i++) {
        const fringe = (i % 3 === 0 ? 3 : i % 3 === 1 ? 1 : 2), hem = hemBase + 2 * Math.sin(i / 4) + fringe;
        const hw = Math.min(widthMax, 10 + (j - top - b) * grow), dx = (i - (cx + 2)) / hw;
        if (j > hem || Math.abs(dx) > 1) continue;
        let v = base + 0.36 * dx + 0.12 * Math.sin((i - cx) / 6.5) - (j - top) / 130;
        if (j > hem - fringe - 1) v -= 0.22;
        set(i, j, 9, v);
      }
    };
    capeLayer(52, 86, 43, 2.3, 0.55);
    capeLayer(50, 66, 34, 2.6, 0.68);
    // red scarf: wrapped round the neck, knotted at the nape, two tails lifting in the wind

    }
    // CRT: scanlines, rolling band, dark corners
    for (let yy = 0; yy < VH; yy += 2) px(ctx, 0, yy, "rgba(0,0,0,0.32)", VW, 1);
    px(ctx, 0, (t * 1.5) % (VH + 40) - 20, "rgba(255,240,210,0.05)", VW, 14);
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.65)"); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  };

  const render = () => {
    uiButtons = [];
    ctx.imageSmoothingEnabled = false;
    if (state === "scores" || state === "coin") { renderScores(); return; }

    if (state === "title") {
      drawPan(); px(ctx, 0, 0, "rgba(12,8,6,0.45)", VW, VH);
      const lg = VW >= 280 ? LOGO : LOGO_S, reveal = Math.min(1, st / 50);
      const lx = Math.round((VW - lg.width) / 2), ly = Math.max(4, Math.round(VH * 0.38 - lg.height / 2));
      if (reveal >= 1) ctx.drawImage(lg, lx, ly);
      else { // the logo burns in through a dither
        const tmp = makeCanvas(lg.width, lg.height), tx = tmp.getContext("2d"); tx.drawImage(lg, 0, 0);
        const im = tx.getImageData(0, 0, lg.width, lg.height); for (let y = 0; y < lg.height; y++) for (let x = 0; x < lg.width; x++) if (BAYER[y & 3][x & 3] / 16 > reveal) im.data[(y * lg.width + x) * 4 + 3] = 0;
        tx.putImageData(im, 0, 0); ctx.drawImage(tmp, lx, ly);
      }
      if (st > 50 && Math.floor(t / 30) % 2 === 0) centered("PRESS ENTER OR TAP", VH - 30, 1, "#efe2c8");
      centered("HI-SCORE " + board[0][0] + " LV " + board[0][1], VH - 16, 1, "#e8c060");
      if (touch) uiButton("< ARCADE", 4, 4, 40, 12, backToArcade);
      return;
    }

    if (state === "brief") {
      drawPan(); panel();
      const pages = [
        ["THE DUEL", ["THREE GUNS. ONE GRAVEYARD.", "TWO RIVALS: SHOOT THEM BOTH."]],
        ["WAIT...", ["BLACK CROWS, TUMBLEWEEDS, DUST:", "DECOYS. KEEP YOUR HANDS STILL."]],
        ["...THEN DRAW!", ["THE RED CROW IS THE SIGNAL.", "SHOOT BOTH RIVALS, FAST."]],
        ["YOUR GUNS", kbd ? ["Q: LEFT RIVAL   E: RIGHT RIVAL", "M: SOUND ON / OFF"] : ["LEFT GUN: LEFT RIVAL", "RIGHT GUN: RIGHT RIVAL"]],
        ["HONOUR", ["SHOOT TOO EARLY: LOSE A STAR.", "NO STARS OR SHOT DEAD: GAME OVER."]],
      ];
      const [title, lines] = pages[tut], z = Math.max(1, Math.min(2, Math.floor(VH / 90), Math.floor((VW - 10) / 86))), cy = Math.round(VH * (L.land ? 0.44 : 0.4)), ty = Math.round(VH * (L.land ? 0.72 : 0.66));
      centered(title, 8, 2, tut === 2 ? "#ff7a6a" : "#e8c060");
      if (tut === 0) {
        const a = charFor(0), b = charFor(1);
        ctx.drawImage(a.sprite, 0, 0, 26, 46, Math.round(VW / 2 - 30 * z - 13 * z), cy - 23 * z, 26 * z, 46 * z);
        ctx.drawImage(b.sprite, 0, 0, 26, 46, Math.round(VW / 2 + 30 * z - 13 * z), cy - 23 * z, 26 * z, 46 * z);
        centered("VS", cy - 4, 2, "#efe2c8");
      }
      if (tut === 1) {
        crow(ctx, Math.round(VW / 2 - 38 * z), cy - 18 * z, Math.floor(st / 8) % 2, "#1e1820", "#3a3240", 2 * z);
        tumbleweed(ctx, Math.round(VW / 2), cy + 4 * z + Math.round(-Math.abs(Math.sin(st / 9)) * 4), st / 6);
        for (let k = 0; k < 4; k++) puff(ctx, VW / 2 + 22 * z + k * 5 * z, cy + 6 * z - k * z, (st * 0.6 + k * 8) % 34, 34);
      }
      if (tut === 2) crow(ctx, Math.round(VW / 2 - 10 * z), cy - 10 * z - Math.round((st % 60) / 6), Math.floor(st / 5) % 2, "#c8202a", "#ff7a6a", 3 * z);
      if (tut === 3) {
        const phase = Math.floor(st / 40) % 2, r = 18;
        [[VW * 0.32, "Q"], [VW * 0.68, "E"]].forEach(([x, k], i) => {
          const on = phase === i;
          drawCylinder(ctx, Math.round(x), cy + 6, r, true, on);
          if (kbd) keycap(Math.round(x) - 6, cy + 6 - r - 16, k, on);
        });
      }
      if (tut === 4) {
        const lost = Math.floor(st / 40) % 2;
        for (let i = 0; i < 3; i++) ctx.drawImage(STAR[i === 2 && lost ? 1 : 0], Math.round(VW / 2 - 22 + i * 15), cy - 6);
      }
      lines.forEach((ln, i) => centered(ln, ty + i * 11, 1, i === 0 && tut === 2 ? "#ff7a6a" : "#efe2c8"));
      // page dots
      for (let i = 0; i < 5; i++) px(ctx, Math.round(VW / 2 - 18 + i * 8), VH - 24, i === tut ? "#e8c060" : "#5a4636", 4, 4);
      if (Math.floor(t / 30) % 2 === 0) centered(tut < 4 ? (kbd ? "ENTER: NEXT" : "TAP: NEXT") : (kbd ? "ENTER: DUEL" : "TAP: DUEL"), VH - 13, 1, "#e8c060");
      return;
    }

    if (state === "intro") {
      // three cuts: left rival's eyes, right rival's eyes, your hat and the back of your neck
      px(ctx, 0, 0, "#000", VW, VH);
      const cut = Math.min(2, Math.floor(st / 50)), k = Math.max(2, Math.floor(VW / 64)), w = 64 * k, h = 16 * k, x = Math.round((VW - w) / 2), y = Math.round((VH - h) / 2);
      if (cut < 2) ctx.drawImage(rivals[cut].C.eyes, 0, 0, 64, 16, x, y, w, h);
      else { const z = Math.max(1, Math.floor(Math.min(VW * 0.9 / 96, VH * 0.45 / 54))); ctx.drawImage(PLAYER[(Math.floor(st / 14) % 2)], 12, 4, 96, 54, Math.round((VW - 96 * z) / 2), Math.round(y + h - 54 * z), 96 * z, 54 * z); }
      centered(cut < 2 ? rivals[cut].C.name : "YOU", y + h + 8, 1, "#b6a184");
      centered("LEVEL " + level, Math.max(4, y - 16), 2, "#e8c060");
      return;
    }

    drawScene();
    const hot = state === "draw";
    if (state === "wait" || state === "draw") drawTriggers(hot);
    if (state === "draw" && st > 10 && st < 60) text(ctx, "DRAW", Math.round(VW / 2 - 7), VH - 12, 1, "#ff7a6a");
    drawHud();
    if (whiteout > 0) px(ctx, 0, 0, `rgba(255,252,240,${(0.3 + whiteout * 0.17).toFixed(2)})`, VW, VH);
    else if (flash > 0) px(ctx, 0, 0, state === "dead" || state === "early" ? "rgba(200,40,30,0.35)" : "rgba(255,240,200,0.4)", VW, VH);
    if (state === "won") { centered("CLEAN SHOT", Math.round(VH * 0.18), 2, "#e8c060"); centered((result.ms / 1000).toFixed(3) + " S", Math.round(VH * 0.18) + 16, 2, "#efe2c8"); }
    if (state === "early") { const ey = L.land ? 4 : Math.round(VH * 0.2); centered("TOO EARLY!", ey, 3, "#ff7a6a"); centered(honor > 0 ? "-1 STAR. THE DUEL STARTS AGAIN" : "NO STARS LEFT", ey + 20, 1, "#efe2c8"); }
    if (state === "dead") { px(ctx, 0, 0, "rgba(90,10,8,0.35)", VW, VH); centered("YOU'RE DEAD", Math.round(VH * 0.25), 3, "#ff7a6a"); centered("SHOT BY " + result.by, Math.round(VH * 0.25) + 22, 1, "#efe2c8"); }
    if (state === "over") {
      panel(0.7);
      centered("GAME OVER", Math.round(VH / 2 - 26), 3, "#ff7a6a");
      centered("YOU REACHED LEVEL " + level, Math.round(VH / 2 - 2), 1, "#efe2c8");
      if (bestMs) centered("BEST DOUBLE KILL " + (bestMs / 1000).toFixed(3) + " S", Math.round(VH / 2 + 10), 1, "#e8c060");
      if (st > 50 && Math.floor(t / 30) % 2 === 0) centered("PRESS ENTER OR TAP", Math.round(VH / 2 + 26), 1, "#efe2c8");
    }
    if (state === "initials") {
      panel(0.92);
      centered("NEW SCORE", 8, 2, "#e8c060");
      centered("LEVEL " + level + (bestMs ? "  " + (bestMs / 1000).toFixed(3) + "S" : ""), 26, 1, "#efe2c8");
      const kk = 5, cw = 15, gap = 12, x0 = Math.round((VW - (3 * cw + 2 * gap)) / 2), ly = 52;
      initials.forEach((li, i) => {
        const x = x0 + i * (cw + gap), sel = i === slot;
        text(ctx, "↑", x + 4, ly - 16, 2, sel ? "#ff7a6a" : "#6a5a48");
        text(ctx, LETTERS[li], x, ly, kk, sel ? "#e8c060" : "#efe2c8");
        text(ctx, "↓", x + 4, ly + 31, 2, sel ? "#ff7a6a" : "#6a5a48");
        // tap the top half of a letter to go forward, the bottom half to go back
        uiButtons.push({ x: x - 6, y: ly - 20, w: cw + 12, h: 32, act: () => { slot = i; letter(1); } });
        uiButtons.push({ x: x - 6, y: ly + 12, w: cw + 12, h: 32, act: () => { slot = i; letter(-1); } });
      });
      if (touch) {
        // the same chunky buttons as in play, reshaped for picking letters
        const by = VH - 30, bw = 28;
        uiButton("<", 6, by, bw, 24, () => { slot = Math.max(0, slot - 1); });
        uiButton(">", 6 + bw + 4, by, bw, 24, () => { slot = Math.min(2, slot + 1); });
        uiButton("↑", VW - 6 - 44 - 4 - bw * 2 - 4, by, bw, 24, () => letter(1));
        uiButton("↓", VW - 6 - 44 - 4 - bw, by, bw, 24, () => letter(-1));
        uiButton("OK", VW - 6 - 44, by, 44, 24, advance, true);
      } else {
        uiButton("OK", Math.round(VW / 2 - 20), ly + 50, 40, 16, advance, true);
        centered("TYPE OR USE ARROWS, THEN ENTER", VH - 12, 1, "#b6a184");
      }
    }
  };

  // =====================================================================
  // loop
  // =====================================================================
  let last = performance.now(), acc = 0;
  const loop = (now) => {
    acc = Math.min(acc + (now - last) / 1000, 0.1); last = now;
    while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
    render();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>San Tufellos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Just the game, filling whatever window it is opened in. Single dark look by choice. */
:root { --fg: #efe4d0; --accent: #f07a3c; --display: "Pixelify Sans", "Courier New", monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #0d0b11; color: var(--fg); overflow: hidden; }
.stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
canvas:focus { outline: none; }
.pad { display: none; width: 100%; max-width: 520px; justify-content: space-between; gap: 8px; }
.pad div { display: flex; gap: 8px; }
.pad button {
  width: 62px; height: 62px; border: 2px solid #1b1424; border-bottom-width: 5px; background: #2a2333; color: var(--fg);
  font-family: var(--display); font-size: 0.85rem; touch-action: none; border-radius: 0;
}
.pad button.on { background: var(--accent); color: #17131d; transform: translateY(2px); border-bottom-width: 3px; }
.touch .stage.show-pad .pad { display: flex; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" tabindex="0" aria-label="San Tufellos game"></canvas>
  <div class="pad" id="pad">
    <div><button data-k="left" aria-label="Steer left">◀</button><button data-k="right" aria-label="Steer right">▶</button></div>
    <div><button data-k="hb">DRIFT</button><button data-k="down">BRAKE</button><button data-k="up">GAS</button></div>
  </div>
</div>

<script>
(() => {
  // ---------- palette ----------
  const K = "#1b1424";
  const R = {
    panda:   ["#5a1424", "#9a2430", "#d0402e", "#f07a3c", "#ffd08a"],
    gazzella:["#0e1230", "#1d2a64", "#2f4aa0", "#5a86d0", "#bfe0ff"],
    basalto: ["#1f1e2c", "#353548", "#4c4c60", "#6c6a7a", "#8e8a94"],
    travert: ["#6e5a48", "#a88e6e", "#cdb48c", "#e8d6ae", "#fff2d0"],
    asfalto: ["#1c1a26", "#26242f", "#302e3a", "#3e3b48", "#e8dcb8"],
    terra:   ["#2e2c20", "#3e3c28", "#504c30", "#66603a"],
    erba:    ["#1f3a24", "#2c4e2a", "#3e6430", "#5a7a36", "#7a9a44"],
  };
  const ROOF_TILE = [
    ["#4a1c1c", "#8a3424", "#c2582e", "#e08a4a", "#f6c07a"],
    ["#4a2a14", "#8a5428", "#c08040", "#dcaa60", "#f4d898"],
    ["#3a1a18", "#6e3226", "#9a4a32", "#c0704a", "#e0a070"],
  ];
  const ROOF_FLAT = [
    ["#5e564c", "#8a8276", "#b2aa9c", "#ccc4b4", "#e8e0d0"],
    ["#5e4c3c", "#8a7460", "#b49a80", "#cdb698", "#ecdcc0"],
    ["#525660", "#7c8088", "#a4a8ae", "#c2c4c6", "#e2e2de"],
  ];
  const TREES = {
    pine:   { pal: ["#0c2024", "#173a34", "#235637", "#3f7a36", "#86b03c"], puffs: 9, lobe: 0.42 },
    plane:  { pal: ["#1a3418", "#2e5426", "#4a7a2e", "#78a43c", "#b4cc5a"], puffs: 6, lobe: 0.5 },
    cypress:{ pal: ["#081812", "#10281e", "#1a3c2a", "#2c5636", "#4a7440"], puffs: 3, lobe: 0.6 },
    bush:   { pal: ["#14301c", "#22482a", "#386636", "#5a8a3e", "#86ae4c"], puffs: 4, lobe: 0.55 },
  };
  const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const H3 = {}; const rgb = (c) => H3[c] || (H3[c] = hex(c));
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  let seed = 1; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const px = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  const makeCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
  // phone or tablet: touch screen and no mouse
  const touch = window.matchMedia("(pointer: coarse)").matches || (navigator.maxTouchPoints > 0 && !window.matchMedia("(any-pointer: fine)").matches);
  document.documentElement.classList.toggle("touch", touch);

  // ---------- GTA-style mission circle: dim, lit (3 pulse frames), flash ----------
  const MARK = ["#1e5a2e", "#3cf06a", "#3cf06a", "#3cf06a", "#eafff0"].map((ring, f) => {
    const c = makeCanvas(48, 48), x = c.getContext("2d"), r = 20 + (f >= 1 && f <= 3 ? f - 1 : 0);
    for (let yy = 0; yy < 48; yy++) for (let xx = 0; xx < 48; xx++) {
      const d = Math.hypot(xx - 23.5, yy - 23.5);
      if (d <= r + 1 && d >= r - 2) px(x, xx, yy, d > r ? (f ? "#c8ffd0" : "#2a7a3e") : ring);
      else if (d < r - 2) px(x, xx, yy, f === 0 ? "rgba(30,90,46,0.25)" : f === 4 ? "rgba(234,255,240,0.75)" : "rgba(60,240,106," + (0.18 + f * 0.06) + ")");
    }
    return c;
  });

  // ---------- 3x5 pixel font ----------
  const G = {
    A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",
    G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
    M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",
    S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
    Y:"101101010010010",Z:"111001010100111","0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110",
    "4":"101101111001001","5":"111100110001110","6":"011100110101010","7":"111001010010010","8":"010101010101010","9":"010101011001110",
    "!":"010010010000010","+":"000010111010000","-":"000000111000000",":":"000010000010000","/":"001001010100100",".":"000000000000010"," ":"000000000000000",
    "<":"001010100010001",">":"100010001010100","↑":"010111010010010",",":"000000000010100","↓":"010010010111010","=":"000111000111000","'":"010010000000000",
  };
  const textW = (s, k = 1) => s.length * 4 * k - k;
  const text = (ctx, s, x, y, k, col, outline = true) => {
    const draw = (ox, oy, c) => [...s].forEach((ch, i) => {
      const g = G[ch] || G[ch.toUpperCase()] || G[" "];
      for (let j = 0; j < 15; j++) if (g[j] === "1") px(ctx, ox + (i * 4 + (j % 3)) * k, oy + Math.floor(j / 3) * k, c, k, k);
    });
    if (outline) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) draw(x + dx * k, y + dy * k, K);
    draw(x, y, col);
  };

  // ---------- car sprites ----------
  const carHalf = [
    "....kkkkkk", "..kkBBBBBB", ".kyybBBBBB", ".kyyrRRRRR", "kkrRRRRRRR", "ttkRRRrrrr", "ttkRrrrrrr", "ttkRrrrrrr",
    "ttkrrrrrrr", ".krrrrrrrr", ".kdrrrrrrr", "mkdkkkkkkk", ".kdkGGgggg", ".kdkgGGggg", ".kdkggGGgg", ".kdkkkkkkk",
    ".kdRRRRRRR", ".kdRwwRRRR", ".kdRwRRRRR", ".kdRRRRRRR", ".kdrrrrrrr", ".kdrrrrrrr", ".kdkkkkkkk", ".kdkgggggg",
    ".kdkkkkkkk", "ttkdrrrrrr", "ttkdrrrrrr", "ttkdrrrrrr", "ttkdrrrrrr", ".kddrrrrrr", ".koodddddd", "..kkBBBBBB", "....kkkkkk",
  ];
  const shadeRight = { R: "r", G: "g", w: "R", B: "b" };
  const carRows = carHalf.map((row) => row + [...row].reverse().map((ch) => shadeRight[ch] || ch).join(""));
  const carPal = (ramp, stripe) => ({
    k: K, m: ramp[1], t: "#2a2430", b: "#5a5868", B: "#9c98a8", y: "#ffe27a", o: "#ff4a3a",
    g: "#2c3e5c", G: "#6f9cc4", d: stripe || ramp[1], r: ramp[2], R: ramp[3], w: ramp[4],
  });
  const carSprite = (pal, siren) => {
    const c = makeCanvas(20, 33), x = c.getContext("2d");
    carRows.forEach((row, yy) => [...row].forEach((ch, xx) => { if (pal[ch]) px(x, xx, yy, pal[ch]); }));
    if (siren !== undefined) {
      px(x, 4, 17, K, 12, 3);
      px(x, 5, 18, siren === 0 ? "#bfe0ff" : "#1d2a64", 4, 1);
      px(x, 11, 18, siren === 0 ? "#1d2a64" : "#bfe0ff", 4, 1);
      px(x, siren === 0 ? 5 : 14, 18, "#ffffff");
      px(x, 9, 18, "#c8c8d0", 2, 1);
    }
    return c;
  };
  // pixel-exact rotation (no blur): 64 precomputed frames
  const FRAMES = 64, FS = 40;
  const rotations = (src, shadow) => {
    const sw = src.width, sh = src.height, sd = src.getContext("2d").getImageData(0, 0, sw, sh).data;
    return Array.from({ length: FRAMES }, (_, f) => {
      const a = (f / FRAMES) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const c = makeCanvas(FS, FS), x = c.getContext("2d"), img = x.createImageData(FS, FS);
      for (let y = 0; y < FS; y++) for (let xx = 0; xx < FS; xx++) {
        const dx = xx - FS / 2 + 0.5, dy = y - FS / 2 + 0.5;
        const sx = Math.round(dx * ca + dy * sa + sw / 2 - 0.5), sy = Math.round(-dx * sa + dy * ca + sh / 2 - 0.5);
        if (sx < 0 || sy < 0 || sx >= sw || sy >= sh) continue;
        const i = (sy * sw + sx) * 4, o = (y * FS + xx) * 4;
        if (sd[i + 3] < 128) continue;
        if (shadow) { img.data[o] = 10; img.data[o + 1] = 6; img.data[o + 2] = 16; img.data[o + 3] = 140; }
        else { img.data[o] = sd[i]; img.data[o + 1] = sd[i + 1]; img.data[o + 2] = sd[i + 2]; img.data[o + 3] = 255; }
      }
      x.putImageData(img, 0, 0);
      return c;
    });
  };
  const frameOf = (a) => ((Math.round((a / (Math.PI * 2)) * FRAMES) % FRAMES) + FRAMES) % FRAMES;
  console.assert(frameOf(0) === 0 && frameOf(Math.PI) === 32 && frameOf(-Math.PI / 2) === 48, "frameOf");
  const PANDA = rotations(carSprite(carPal(R.panda)));
  const GAZZ = [0, 1].map((s) => rotations(carSprite(carPal(R.gazzella, "#c8202a"), s)));
  const WRECK = rotations(carSprite(carPal(["#101018", "#1a1a26", "#2a2a38", "#3a3a4a", "#5a5a6a"], "#4a1418")));
  const SHADOW = rotations(carSprite(carPal(R.panda)), true);

  // ---------- floppy with "CVE" crossed out, Ghostbusters style ----------
  const FLOPPY = (() => {
    const c = makeCanvas(26, 26), x = c.getContext("2d");
    px(x, 0, 0, K, 26, 26); px(x, 1, 1, "#2a3a8a", 24, 24);
    px(x, 1, 1, "#4a6ad0", 24, 1); px(x, 1, 1, "#4a6ad0", 1, 24);
    px(x, 24, 2, "#101a3a", 1, 23); px(x, 2, 24, "#101a3a", 23, 1);
    px(x, 6, 1, K, 13, 8); px(x, 7, 1, "#9aa0b0", 11, 7); px(x, 8, 1, "#c8ccd8", 2, 7); px(x, 14, 2, K, 3, 5);
    px(x, 3, 10, "#f0ead0", 20, 14); px(x, 3, 23, "#cdc4a8", 20, 1);
    for (let yy = 10; yy < 24; yy++) for (let xx = 3; xx < 23; xx++) {
      const dd = Math.hypot(xx - 12.5, yy - 16.5);
      if (dd >= 5.2 && dd < 7.0) px(x, xx, yy, dd > 6.4 ? "#8a1418" : "#d02020");
    }
    const g = (ch, ox) => { for (let j = 0; j < 15; j++) if (G[ch][j] === "1") px(x, ox + (j % 3), 14 + Math.floor(j / 3), K); };
    g("C", 7); g("V", 11); g("E", 15);
    for (let i = 0; i < 9; i++) px(x, 8 + i, 12 + i, "#d02020", 2, 1);
    return c;
  })();

  // ---------- insert-coin coin: 4 spin frames ----------
  const COIN = [10, 6, 2, 6].map((w) => {
    const c = makeCanvas(12, 12), x = c.getContext("2d"), l = 6 - w / 2;
    px(x, l - 1, 1, K, w + 2, 10); px(x, l, 0, K, w, 12);
    px(x, l, 1, "#f0a030", w, 10);
    if (w > 2) px(x, l, 1, "#ffe27a", Math.max(1, w - 3), 9);
    if (w > 6) px(x, l + 4, 3, "#c87820", 2, 6);
    return c;
  });

  // ---------- boost pad: 3 chevrons that light up in sequence ----------
  const PAD = [0, 1, 2].map((f) => {
    const c = makeCanvas(22, 26), x = c.getContext("2d");
    px(x, 0, 0, K, 22, 26); px(x, 1, 1, "#2a2333", 20, 24);
    for (let k = 0; k < 3; k++) {
      const lit = (k + f) % 3 === 0, col = lit ? "#ffe27a" : "#f07a3c", y0 = 17 - k * 7;
      for (let i = 0; i < 8; i++) { px(x, 3 + i, y0 + (8 - i) * 0.5 | 0, col, 2, 2); px(x, 17 - i, y0 + (8 - i) * 0.5 | 0, col, 2, 2); }
    }
    return c;
  });

  // =====================================================================
  // LEVEL: Tufello, built for driving. Play area is 1200x1000 with police
  // barriers around it; a 240 px band of city outside keeps the view full.
  // =====================================================================
  const M = 260, PW = 1600, PH = 1300, W = PW + 2 * M, H = PH + 2 * M;
  const P = (x, y) => [x + M, y + M];
  const C = { ground: 0, road: 1, walk: 2, median: 3, stone: 4, island: 5, bld: 6, fence: 7, barrier: 8, garden: 9, stall: 10 };
  const SOLID = new Uint8Array(16); SOLID[C.bld] = SOLID[C.fence] = SOLID[C.barrier] = SOLID[C.stall] = 1;
  const cls = new Uint8Array(W * H);
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? C.barrier : cls[(y | 0) * W + (x | 0)]);

  const bez = (p0, p1, p2, p3, n = 18) => {
    const out = [];
    for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push(u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]); }
    return out;
  };
  const roundRect = (x0, y0, x1, y1, r) => {
    const out = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 10; i++) { const a = a0 + (i / 10) * Math.PI / 2; out.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } };
    arc(x1 - r, y0 + r, -Math.PI / 2); arc(x1 - r, y1 - r, 0); arc(x0 + r, y1 - r, Math.PI / 2); arc(x0 + r, y0 + r, Math.PI); out.push(out[0], out[1]);
    return out;
  };
  const shift = (pts) => pts.map((v) => v + M);
  const JONIO = { x: 400 + M, y: 300 + M };
  const HQ = { x: 800 + M, y: 728 + M }; // the green mission circle in front of the HQ gate
  // roads in play coordinates: [width, dashed centre line, points, part of the boulevard]
  // every road leads to the crossroads by HQ, so the villa is easy to reach from anywhere
  const ROADS = [
    [50, true, [-260, 268, 1860, 268], 1], [50, true, [-260, 332, 1860, 332], 1],              // Viale Jonio, both carriageways
    [26, false, [-260, 216, 1860, 216], 1], [26, false, [-260, 384, 1860, 384], 1],            // its side lanes
    [58, true, roundRect(80, 80, 1520, 1220, 220)],                                             // the outer loop: long straights, wide drift corners
    [46, true, [800, 332, 800, 640]],                                                           // every road meets at the crossroads by HQ
    [46, true, bez([800, 560], [1000, 500], [1120, 420], [1180, 332])],
    [46, true, [800, 640, 800, 1220, 800, 1560]],                                               // Via Capraia: HQ gate, then the market
    [46, true, [...bez([800, 640], [1100, 640], [1250, 760], [1520, 760]), 1860, 780]],
    [46, true, [...bez([800, 640], [500, 640], [350, 560], [80, 580]), -260, 560]],
    [46, true, [...bez([800, 760], [600, 900], [380, 980], [260, 1220]), 220, 1560]],
    [46, true, [...bez([800, 1000], [950, 940], [1100, 1100], [1300, 1000]), 1520, 980]],     // the chicane
    [46, true, [400, 171, 400, 80, 400, -260]],
    [46, true, [...bez([1100, 216], [1100, 150], [1200, 140], [1250, 80]), 1260, -260]],
  ].map(([w, d, p, b]) => [w, d, shift(p), b]);
  const MEDIANS = [[14, [-260, 300, 1860, 300]], [14, [-260, 242, 1860, 242]], [14, [-260, 358, 1860, 358]]].map(([w, p]) => [w, shift(p)]);

  const scratch = makeCanvas(W, H), sc = scratch.getContext("2d", { willReadFrequently: true });
  const layer = (code, draw, onlyOver) => {
    sc.clearRect(0, 0, W, H); sc.fillStyle = sc.strokeStyle = "#fff"; sc.lineCap = sc.lineJoin = "round";
    draw(sc);
    const a = sc.getImageData(0, 0, W, H).data;
    for (let i = 0; i < W * H; i++) if (a[i * 4 + 3] > 127 && (onlyOver === undefined || cls[i] === onlyOver)) cls[i] = code;
  };
  const poly = (ctx, p) => { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); };
  const circle = (ctx, x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); };
  layer(C.walk, (c) => { ROADS.forEach(([w, , p]) => { c.lineWidth = w + 24; poly(c, p); c.stroke(); }); c.lineWidth = 94; circle(c, JONIO.x, JONIO.y, 96); c.stroke(); });
  layer(C.road, (c) => ROADS.forEach(([w, , p, b]) => { if (b) { c.lineWidth = w; poly(c, p); c.stroke(); } }));
  layer(C.median, (c) => MEDIANS.forEach(([w, p]) => { c.lineWidth = w; poly(c, p); c.stroke(); }));
  // the other roads cut through the medians where they meet the boulevard
  layer(C.road, (c) => { ROADS.forEach(([w, , p, b]) => { if (!b) { c.lineWidth = w; poly(c, p); c.stroke(); } }); c.lineWidth = 66; circle(c, JONIO.x, JONIO.y, 96); c.stroke(); });
  layer(C.island, (c) => { circle(c, JONIO.x, JONIO.y, 62); c.fill(); });
  layer(C.stone, (c) => { c.fillRect(...P(832, 880), 170, 220); }, C.ground);
  const dash = new Uint8Array(W * H);
  sc.clearRect(0, 0, W, H); sc.setLineDash([12, 12]); sc.lineWidth = 2; sc.lineCap = "butt";
  ROADS.forEach(([, d, p]) => { if (d) { poly(sc, p); sc.stroke(); } });
  sc.setLineDash([]);
  { const a = sc.getImageData(0, 0, W, H).data; for (let i = 0; i < W * H; i++) dash[i] = a[i * 4 + 3] > 127 && cls[i] === C.road ? 1 : 0; }

  // barrier band around the play area
  const inBand = (x, y) => { const qx = x - M, qy = y - M; return (qx >= -4 && qx <= PW + 4 && qy >= -4 && qy <= PH + 4) && (qx < 4 || qx > PW - 4 || qy < 4 || qy > PH - 4); };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inBand(x, y)) cls[y * W + x] = C.barrier;

  // ---------- paint the base terrain ----------
  const world = makeCanvas(W, H), wc = world.getContext("2d");
  const img = wc.createImageData(W, H), B = img.data;
  const canopy = makeCanvas(W, H), cctx = canopy.getContext("2d");
  const cimg = cctx.createImageData(W, H), CB = cimg.data;
  const put = (x, y, c, buf = B) => { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; const o = (y * W + x) * 4, v = rgb(c); buf[o] = v[0]; buf[o + 1] = v[1]; buf[o + 2] = v[2]; buf[o + 3] = 255; };
  const shade = (x, y, a) => { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; const o = (y * W + x) * 4; B[o] = B[o] * (1 - a) + 10 * a; B[o + 1] = B[o + 1] * (1 - a) + 6 * a; B[o + 2] = B[o + 2] * (1 - a) + 16 * a; };
  const near = (x, y, code) => at(x, y - 1) === code || at(x, y + 1) === code || at(x - 1, y) === code || at(x + 1, y) === code;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, c = cls[i], h = hash(x, y);
    let col;
    if (c === C.road) {
      col = dash[i] && h > 0.1 ? R.asfalto[4] : R.asfalto[h < 0.05 ? 3 : h < 0.24 ? 2 : h < 0.31 ? 0 : 1];

    const mask = (draw) => {
      const c = makeCanvas(Wd, Hd), x = c.getContext("2d"); draw(x);
      const a = x.getImageData(0, 0, Wd, Hd).data, m = new Uint8Array(Wd * Hd);
      for (let n = 0; n < m.length; n++) m[n] = a[n * 4 + 3] > 110 ? 1 : 0;
      return m;
    };
    const grow = (m) => { const o = m.slice(); for (let y = 1; y < Hd - 1; y++) for (let x = 1; x < Wd - 1; x++) { const n = y * Wd + x; if (!m[n] && (m[n - 1] || m[n + 1] || m[n - Wd] || m[n + Wd] || m[n - Wd - 1] || m[n + Wd + 1] || m[n - Wd + 1] || m[n + Wd - 1])) o[n] = 1; } return o; };
    const paint = (m, colAt) => { for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) if (m[y * Wd + x]) { const c = colAt(x, y); if (c) px(L, x, y, c); } };
    const font = (sz) => `${sz}px "Bowlby One", Impact, "Arial Black", sans-serif`;
    if (small) text(L, "GRAND THEFT PANDA", Math.round((Wd - textW("GRAND THEFT PANDA")) / 2), 3, 1, "#efe4d0");
    else {
      const top = mask((x) => { x.fillStyle = "#000"; x.font = font(13); x.textBaseline = "top"; ["GRAND", "THEFT", "PANDA"].forEach((w, n) => x.fillText(w, 10, 4 + n * 13)); });
      const top1 = grow(top);
      paint(grow(top1), () => K); paint(top1, () => K);
      paint(top, (x, y) => (y % 13 < 3 ? "#ffffff" : "#efe4d0"));
    }
    const big = mask((x) => {
      x.fillStyle = "#000"; x.textBaseline = "alphabetic"; let sz = small ? 26 : 40; x.font = font(sz);
      while (x.measureText("San Tufellos").width > Wd - 20 && sz > 8) x.font = font(--sz);
      x.fillText("San Tufellos", small ? Math.round((Wd - x.measureText("San Tufellos").width) / 2) : 10, small ? Hd - 9 : 96);
    });
    const b1 = grow(big), b2 = grow(b1), b3 = grow(b2);
    for (let y = 0; y < Hd - 2; y++) for (let x = 0; x < Wd - 2; x++) if (b3[y * Wd + x]) px(L, x + 2, y + 2, K);
    paint(b3, () => K); paint(b2, () => "#fff2d0"); paint(b1, () => K);
    const bands = [R.panda[4], R.panda[3], R.panda[3], R.panda[2], R.panda[2], R.panda[1]];
    let y0 = Hd, y1 = 0; for (let n = 0; n < big.length; n++) if (big[n]) { const yy = Math.floor(n / Wd); y0 = Math.min(y0, yy); y1 = Math.max(y1, yy); }
    paint(big, (x, y) => bands[clamp(Math.floor((y - y0) / Math.max(1, y1 - y0) * bands.length + ((x + y) % 2) * 0.35), 0, bands.length - 1)]);
  };
  const buildLogo = () => { logoInto(LOGO, false); logoInto(LOGO_S, true); };
  buildLogo();
  if (document.fonts) document.fonts.load('40px "Bowlby One"').then(buildLogo).catch(() => {});

  // ---------- fixed-step loop: 60 updates a second ----------
  let last = performance.now(), acc = 0;
  const loop = (now) => {
    acc = Math.min(acc + (now - last) / 1000, 0.1); last = now;
    while (acc >= 1 / 60) { update(1 / 60); acc -= 1 / 60; }
    render();
    requestAnimationFrame(loop);
  };
  go("title");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

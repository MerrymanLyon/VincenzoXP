<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rye&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Game select: a black room with two arcade screens. Each logo is drawn as if lit on an LCD: RGB sub-pixels, scan gaps, glow. */
:root { --fg: #efe2c8; --muted: #8a7e70; --hot: #ff7a3c; --display: "Pixelify Sans", "Courier New", monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
body {
  font-family: var(--display); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
h1 { margin: 0; font-size: clamp(1rem, 3.4vw, 1.5rem); letter-spacing: 0.18em; font-weight: 700; text-align: center; }
h1 span { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.games { display: flex; gap: clamp(16px, 4vw, 40px); align-items: stretch; justify-content: center; width: 100%; max-width: 1000px; }
.game {
  flex: 1 1 0; min-width: 0; max-width: 460px; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 12px; -webkit-tap-highlight-color: transparent;
}
.screen {
  position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 18px; background: #050705; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 3px #1a1a1a, inset 0 0 40px rgba(0, 0, 0, 0.9), 0 0 0 8px #0e0e0e, 0 0 0 10px #262626;
  transition: transform 120ms ease-out;
}
.screen::after { /* curved glass: dark corners and a soft highlight */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.06), transparent 45%), radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
}
.screen canvas { display: block; image-rendering: pixelated; filter: drop-shadow(0 0 6px var(--glow)) brightness(1.15); animation: flicker 6s steps(1) infinite; }
@keyframes flicker { 0%, 93%, 100% { opacity: 1; } 94% { opacity: 0.86; } 96% { opacity: 0.95; } }
.label { font-size: 0.9rem; color: var(--muted); letter-spacing: 0.12em; }
.game:hover .screen, .game:focus-visible .screen, .game.sel .screen { transform: scale(1.02); box-shadow: inset 0 0 0 3px #1a1a1a, inset 0 0 40px rgba(0, 0, 0, 0.9), 0 0 0 8px #0e0e0e, 0 0 0 10px var(--hot); }
.game:hover .label, .game:focus-visible .label, .game.sel .label { color: var(--fg); }
.game:active .screen { transform: scale(0.98); }
.game:focus { outline: none; }
.hint { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; text-align: center; }
@media (orientation: portrait) and (max-width: 700px) { .games { flex-direction: column; align-items: center; } .game { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .screen canvas, h1 span { animation: none; } }
</style>
</head>
<body>
  <h1>CHOOSE YOUR GAME<span>_</span></h1>
  <div class="games">
    <button class="game" data-href="/santufellos/index.html" style="--glow: rgba(255,140,60,0.55)"><div class="screen"><canvas id="lcd-tufellos"></canvas></div><span class="label">SAN TUFELLOS</span></button>
    <button class="game" data-href="/zeroday/index.html" style="--glow: rgba(255,90,50,0.55)"><div class="screen"><canvas id="lcd-zeroday"></canvas></div><span class="label">THE GOOD, THE BAD &amp; THE ZERO-DAY</span></button>
  </div>
  <p class="hint">TAP A SCREEN · OR ← → AND ENTER</p>
<script>
(() => {
  const K = "#140c08";
  const px = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  const makeCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const G = { G: "011100101101011", R: "110101110101101", A: "010101111101101", N: "110101101101101", D: "110101101101110", T: "111010010010010", H: "101101111101101", E: "111100110100111", F: "111100110100100", P: "110101110100100", " ": "000000000000000" };
  const text = (ctx, s, x, y, col) => [...s].forEach((ch, i) => { const g = G[ch] || G[" "]; for (let j = 0; j < 15; j++) if (g[j] === "1") px(ctx, x + i * 4 + (j % 3), y + Math.floor(j / 3), col); });

  // the same lettering pipeline the two games use: mask, outlines, banded fill
  const logo = (Wd, Hd, draw) => {
    const cv = makeCanvas(Wd, Hd), L = cv.getContext("2d");
    const mask = (fn) => { const c = makeCanvas(Wd, Hd), x = c.getContext("2d"); fn(x); const a = x.getImageData(0, 0, Wd, Hd).data, m = new Uint8Array(Wd * Hd); for (let n = 0; n < m.length; n++) m[n] = a[n * 4 + 3] > 110 ? 1 : 0; return m; };
    const grow = (m) => { const o = m.slice(); for (let y = 1; y < Hd - 1; y++) for (let x = 1; x < Wd - 1; x++) { const n = y * Wd + x; if (!m[n] && (m[n - 1] || m[n + 1] || m[n - Wd] || m[n + Wd] || m[n - Wd - 1] || m[n + Wd + 1] || m[n - Wd + 1] || m[n + Wd - 1])) o[n] = 1; } return o; };
    const paint = (m, colAt) => { for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) if (m[y * Wd + x]) { const c = colAt(x, y); if (c) px(L, x, y, c); } };
    const bigBlock = (m, bands, worn) => {
      const b1 = grow(m), b2 = grow(b1), b3 = grow(b2);
      for (let y = 0; y < Hd - 2; y++) for (let x = 0; x < Wd - 2; x++) if (b3[y * Wd + x]) px(L, x + 2, y + 2, K);
      paint(b3, () => K); paint(b2, () => "#fff2d0"); paint(b1, () => K);
      let y0 = Hd, y1 = 0; for (let n = 0; n < m.length; n++) if (m[n]) { const yy = Math.floor(n / Wd); y0 = Math.min(y0, yy); y1 = Math.max(y1, yy); }
      paint(m, (x, y) => (worn && hash(x * 3, y) < 0.06 ? "#5a140e" : bands[clamp(Math.floor(((y - y0) / Math.max(1, y1 - y0)) * bands.length + ((x + y) % 2) * 0.35), 0, bands.length - 1)]));
    };
    draw({ L, mask, grow, paint, bigBlock, Wd, Hd });
    return cv;
  };
  const fitText = (x, s, maxW, sz, fam) => { x.font = `${sz}px ${fam}`; while (x.measureText(s).width > maxW && sz > 6) x.font = `${--sz}px ${fam}`; return x.measureText(s).width; };
  const tufellos = () => logo(232, 104, ({ L, mask, grow, paint, bigBlock, Wd }) => {
    const fam = '"Bowlby One", Impact, sans-serif';
    const top = mask((x) => { x.fillStyle = "#000"; x.font = `13px ${fam}`; x.textBaseline = "top"; ["GRAND", "THEFT", "PANDA"].forEach((w, n) => x.fillText(w, 10, 4 + n * 13)); });
    const t1 = grow(top); paint(grow(t1), () => K); paint(t1, () => K); paint(top, (x, y) => (y % 13 < 3 ? "#ffffff" : "#efe4d0"));
    bigBlock(mask((x) => { x.fillStyle = "#000"; fitText(x, "San Tufellos", Wd - 20, 40, fam); x.fillText("San Tufellos", 10, 96); }), ["#ffd08a", "#f07a3c", "#f07a3c", "#d0402e", "#d0402e", "#9a2430"], false);
  });
  const zeroday = () => logo(260, 110, ({ L, mask, grow, paint, bigBlock, Wd, Hd }) => {
    const fam = 'Rye, Georgia, serif';
    const centre = (x, s, y, sz) => { const w = fitText(x, s, Wd - 12, sz, fam); x.fillText(s, Math.round((Wd - w) / 2), y); };
    const top = mask((x) => { x.fillStyle = "#000"; centre(x, "THE GOOD, THE BAD", 22, 17); centre(x, "& THE", 39, 13); });
    const t1 = grow(top); paint(grow(t1), () => K); paint(t1, () => K); paint(top, (x, y) => (hash(x, y) < 0.07 ? "#b8a07a" : y % 7 < 2 ? "#fff4dc" : "#efe2c8"));
    bigBlock(mask((x) => { x.fillStyle = "#000"; centre(x, "ZERO-DAY", Hd - 12, 52); }), ["#ffd27a", "#f6a24a", "#e8702e", "#d04a24", "#a82a1c", "#7a1a14"], true);
    [".X.....X", "..X...X.", "...XXX..", "....X..."].forEach((row, j) => [...row].forEach((ch, i) => { if (ch === "X") px(L, Wd - 40 + i * 2, Hd - 64 + j * 2, j === 2 && i === 5 ? "#ff7a6a" : "#c8202a", 2, 2); }));
  });

  // LCD look: every logo pixel becomes a cell of red, green and blue stripes with a dark gap
  const lcd = (canvas, src) => {
    const box = canvas.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    const cell = Math.max(3, Math.floor((box.width * 0.86 * dpr) / src.width));
    const W = src.width * cell, H = src.height * cell, sd = src.getContext("2d").getImageData(0, 0, src.width, src.height).data;
    // on small screens the sub-pixel grid is finer than the screen, so it is shrunk to fit inside the frame
    const cssW = Math.min(W / dpr, box.width * 0.86);
    canvas.width = W; canvas.height = H; canvas.style.width = cssW + "px"; canvas.style.height = (cssW * H) / W + "px";
    const x = canvas.getContext("2d"), img = x.createImageData(W, H), d = img.data, sub = Math.max(1, Math.floor(cell / 3));
    for (let j = 0; j < src.height; j++) for (let i = 0; i < src.width; i++) {
      const o = (j * src.width + i) * 4, a = sd[o + 3] / 255; if (a === 0) continue;
      const rgb = [sd[o], sd[o + 1], sd[o + 2]];
      for (let cy = 0; cy < cell; cy++) for (let cx = 0; cx < cell; cx++) {
        const p = ((j * cell + cy) * W + i * cell + cx) * 4, ch = Math.min(2, Math.floor(cx / sub)), gap = cy === cell - 1 || cx === cell - 1;
        const lift = 0.18; // a little light leaks into the neighbouring sub-pixels
        d[p] = (ch === 0 ? rgb[0] : rgb[0] * lift) * (gap ? 0.35 : 1);
        d[p + 1] = (ch === 1 ? rgb[1] : rgb[1] * lift) * (gap ? 0.35 : 1);
        d[p + 2] = (ch === 2 ? rgb[2] : rgb[2] * lift) * (gap ? 0.35 : 1);
        d[p + 3] = 255 * a;
      }
    }
    x.putImageData(img, 0, 0);
  };
  const draw = () => { lcd(document.getElementById("lcd-tufellos"), tufellos()); lcd(document.getElementById("lcd-zeroday"), zeroday()); };
  draw();
  if (document.fonts) Promise.all([document.fonts.load('40px "Bowlby One"'), document.fonts.load('40px Rye')]).then(draw).catch(() => {});
  let timer; window.addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(draw, 150); });

  // choose with a tap, a click, or the arrow keys and Enter
  const games = [...document.querySelectorAll(".game")];
  let sel = 0;
  const mark = () => games.forEach((g, i) => g.classList.toggle("sel", i === sel));
  games.forEach((g, i) => { g.addEventListener("click", () => { location.href = g.dataset.href; }); g.addEventListener("mouseenter", () => { sel = i; mark(); }); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { sel = 0; mark(); e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { sel = 1; mark(); e.preventDefault(); }
    if (e.key === "Enter" || e.key === " ") { location.href = games[sel].dataset.href; e.preventDefault(); }
  });
  mark(); window.focus();
})();
</script>
</body>
</html>
